name: Runtime PR check

# Proves a change can still produce a working runtime, without publishing

on:
  pull_request:
    paths:
      - "native-apps/runtime-manager/**"
      - "scripts/build_utils/**"
      - "runtime.toml"
      - ".github/workflows/runtime.yml"
      - ".github/workflows/runtime-pr.yml"
  workflow_dispatch:

# A PR that gets three pushes in a row only needs the last one checked.
concurrency:
  group: runtime-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build runtime (${{ matrix.slug }})
    runs-on: ${{ matrix.platform }}
    strategy:
      # Every platform reports, rather than the first failure hiding the
      # others: when a change breaks two of them, one run should say so.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            slug: linux-x64
          - platform: macos-latest
            slug: macos-arm64
          - platform: windows-latest
            slug: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-apps/runtime-manager
          # Shared across the matrix so three runners do not each warm a
          # separate cache for the same dependencies.
          shared-key: runtime-pr

      - name: Formatting
        if: matrix.slug == 'linux-x64'
        working-directory: native-apps/runtime-manager
        shell: bash
        run: cargo fmt --check

      - name: Lint
        working-directory: native-apps/runtime-manager
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: native-apps/runtime-manager
        shell: bash
        run: cargo test --all-targets

      - name: Release script logic
        shell: bash
        run: |
          set -euo pipefail

          # Deriving the delta list: the step that turned D:\a\_temp into a
          # bell character by interpolating a path into Python source.
          SEED_DIR="$RUNNER_TEMP/seedcheck"
          mkdir -p "$SEED_DIR"
          SEED="$SEED_DIR/versions.json"
          printf '{"versions":["1.0.0","1.1.0","1.2.0","1.3.0"]}' > "$SEED"

          SEED_SCRIPT="$SEED_DIR/latest.py"
          cat > "$SEED_SCRIPT" <<'PY'
          import json, sys
          versions = json.load(open(sys.argv[1])).get("versions", [])
          print(" ".join(versions[-3:]))
          PY

          GOT=$(python3 "$SEED_SCRIPT" "$SEED")
          [ "$GOT" = "1.1.0 1.2.0 1.3.0" ] || {
            echo "delta derivation returned '$GOT'"
            exit 1
          }

          # Empty-array expansion under `set -u`. This only genuinely fails
          # on the bash 3.2 that macOS ships; bash 5 treats it as an empty
          # expansion, so on Linux and Windows it is just a smoke test. The
          # macOS leg of this matrix is what makes it meaningful.
          PREVIOUS_ARGS=()
          for p in $GOT; do PREVIOUS_ARGS+=(--previous "$p"); done
          COUNT=$(printf '%s\n' ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"} | wc -l)
          [ "$COUNT" -eq 6 ] || { echo "expected 6 args, got $COUNT"; exit 1; }

          EMPTY_ARGS=()
          printf '%s' ${EMPTY_ARGS[@]+"${EMPTY_ARGS[@]}"} >/dev/null
          echo "  bash ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}: empty expansion OK"

          echo "release script logic OK on ${{ matrix.slug }}"

      - name: Build the app
        shell: bash
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          cp .env.ci .env
          yarn --no-immutable
          yarn build

      - name: Build the publisher and manager
        working-directory: native-apps/runtime-manager
        shell: bash
        run: |
          cargo build --release \
            --bin top-runtime-publish \
            --bin top-runtime-manager

      - name: Assemble, publish and install
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          BASE=native-apps/runtime-manager/target/release
          PUBLISH="$BASE/top-runtime-publish$EXT"
          MANAGER="$BASE/top-runtime-manager$EXT"

          "$PUBLISH" build \
            --repo . \
            --version 0.0.0-pr \
            --schema 1 \
            --channel stable \
            --out "$RUNNER_TEMP/cdn" \
            --dev-key

          # The install has to be verified against the same key the publish
          # just generated, which is not the one compiled into the binary.
          PUBKEY=$(cat native-apps/runtime-manager/dev-pubkey.txt)
          TOP_RUNTIME_PUBKEY="$PUBKEY" "$MANAGER" install \
            --root "$RUNNER_TEMP/root" \
            --source "$RUNNER_TEMP/cdn" \
            --activate

          TOP_RUNTIME_PUBKEY="$PUBKEY" "$MANAGER" status \
            --root "$RUNNER_TEMP/root"
