name: Runtime payload

# Builds the Node runtime (server + node + PostgreSQL + dependencies) and
# publishes it as a signed, content-addressed release the desktop app can
# download after install.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/gemini-*.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Runtime version to publish (e.g. 1.9.0)"
        required: true
      schema_version:
        description: "Bump only when this release adds DB migrations"
        required: true
        default: "1"
      channel:
        description: "Channel to point at this version"
        required: false
        default: "stable"
      previous:
        description: "Override which versions to build deltas from (derived automatically if blank)"
        required: false
        default: ""
  workflow_call:

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  publish:
    name: Publish runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The slug must match what `Platform::current()` produces
          - platform: ubuntu-latest
            slug: linux-x64
          - platform: macos-latest
            slug: macos-arm64
          - platform: windows-latest
            slug: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-apps/runtime-manager

      # Which channel this run publishes, and what to call the version.
      # A tag is a release: stable, named by the tag. A push to main is a
      # nightly: named `0.0.0-nightly.<date>.<short sha>`
      - name: Resolve version and channel
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL="stable"
          else
            VERSION="0.0.0-nightly.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
            CHANNEL="nightly"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION to the $CHANNEL channel"

      # ---------------------------------------------------------------------
      # 1. Build the app.
      # ---------------------------------------------------------------------
      - name: Build the app
        shell: bash
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          cp .env.ci .env
          yarn --no-immutable
          yarn build

      # ---------------------------------------------------------------------
      # 2. Sign native binaries BEFORE hashing.
      # ---------------------------------------------------------------------
      - name: Build the publisher and manager
        working-directory: native-apps/runtime-manager
        shell: bash
        env:
          TOP_RUNTIME_PUBKEY: ${{ secrets.RUNTIME_PUBLIC_KEY }}
          TOP_ANALYTICS_KEY: ${{ vars.ANALYTICS_KEY }}
        run: |
          cargo build --release \
            --bin top-runtime-publish \
            --bin top-runtime-manager

      # Assembly is separate from publishing because native binaries have
      # to be signed *before* they are hashed. Signing embeds a timestamp,
      # so hashing first would give every file a new hash on every release
      # and turn every incremental update into a full download.
      - name: Assemble the runtime tree
        shell: bash
        run: |
          set -euo pipefail
          BIN=native-apps/runtime-manager/target/release/top-runtime-publish
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"

          "$BIN" assemble --repo . --into "$RUNNER_TEMP/runtime"
          echo "RUNTIME_DIR=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"
          du -sh "$RUNNER_TEMP/runtime" || true

      - name: Sign native binaries (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RUNTIME_BASE_URL: ${{ secrets.RUNTIME_BASE_URL }}
        run: |
          set -euo pipefail

          KEY_PASS=$(openssl rand -base64 12)
          KEYCHAIN="$HOME/Library/Keychains/runtime-sign.keychain-db"
          security create-keychain -p "$KEY_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KEY_PASS" "$KEYCHAIN"

          CERT_FILE="$(mktemp).p12"
          echo "$APPLE_CERTIFICATE" | tr -d '[:space:]' | base64 -D > "$CERT_FILE"
          security import "$CERT_FILE" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN"
          rm "$CERT_FILE"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEY_PASS" "$KEYCHAIN"
          security list-keychain -d user -s \
            "$HOME/Library/Keychains/login.keychain-db" "$KEYCHAIN"

          # Under the hardened runtime, unsigned downloaded dylibs will not
          # load at all, so every Mach-O in the payload has to be signed.
          # Signing embeds a timestamp, so a binary signed afresh gets a new
          # hash every release and every update re-downloads all of them.
          # A binary an earlier release already signed is reused from the
          # CDN instead, found by its hash before signing.
          SIGN_SCRIPT="$RUNNER_TEMP/sign.py"
          cat > "$SIGN_SCRIPT" <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, tempfile, urllib.request

          root, base, slug, out, keychain = sys.argv[1:6]
          identity = os.environ["APPLE_SIGNING_IDENTITY"]
          identity_hash = hashlib.sha256(identity.encode()).hexdigest()
          MAGICS = {b"\xfe\xed\xfa\xce", b"\xfe\xed\xfa\xcf", b"\xce\xfa\xed\xfe", b"\xcf\xfa\xed\xfe"}

          def is_macho(path):
              with open(path, "rb") as f:
                  head = f.read(8)
              if head[:4] in MAGICS:
                  return True
              # Universal binaries share their magic with Java class files,
              # which give a version number where these give a slice count.
              return head[:4] == b"\xca\xfe\xba\xbe" and 0 < int.from_bytes(head[4:8], "big") < 20

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def fetch(url):
              with urllib.request.urlopen(url, timeout=120) as r:
                  return r.read()

          signed = {}
          try:
              published = json.loads(fetch(f"{base}/signed/{slug}.json"))
              if published.get("identity") == identity_hash:
                  signed = published.get("signed", {})
          except Exception as e:
              print(f"no signed map to reuse from: {e}")

          def reuse(path, signed_hash):
              raw = fetch(f"{base}/blobs/{signed_hash[:2]}/{signed_hash}")
              if raw[:4] == b"\x28\xb5\x2f\xfd":
                  raw = subprocess.run(["zstd", "-dq"], input=raw, capture_output=True, check=True).stdout
              if hashlib.sha256(raw).hexdigest() != signed_hash:
                  return False
              with tempfile.NamedTemporaryFile(delete=False) as tmp:
                  tmp.write(raw)
              shutil.copymode(path, tmp.name)
              ok = subprocess.run(["codesign", "--verify", "--strict", tmp.name]).returncode == 0
              if ok:
                  shutil.move(tmp.name, path)
              else:
                  os.unlink(tmp.name)
              return ok

          reused = fresh = 0
          for dirpath, _, names in os.walk(root):
              for name in names:
                  path = os.path.join(dirpath, name)
                  if os.path.islink(path) or not is_macho(path):
                      continue
                  unsigned = sha256(path)
                  previous = signed.get(unsigned)
                  try:
                      if previous and reuse(path, previous):
                          reused += 1
                          continue
                  except Exception as e:
                      print(f"could not reuse {path}: {e}")
                  subprocess.run(["codesign", "--force", "--options", "runtime", "--timestamp",
                                  "--keychain", keychain, "--sign", identity, path], check=True)
                  signed[unsigned] = sha256(path)
                  fresh += 1

          os.makedirs(os.path.dirname(out), exist_ok=True)
          with open(out, "w") as f:
              json.dump({"identity": identity_hash, "signed": signed}, f)
          print(f"reused {reused} signed binaries, signed {fresh}")
          PY

          python3 "$SIGN_SCRIPT" "$RUNTIME_DIR" \
            "${RUNTIME_BASE_URL:-https://runtime.theopenpresenter.com}" \
            "${{ matrix.slug }}" "$RUNNER_TEMP/cdn/signed/${{ matrix.slug }}.json" \
            "$KEYCHAIN"

          security delete-keychain "$KEYCHAIN"

      # ---------------------------------------------------------------------
      # 3. Seed the output with what is already published, so deltas have
      #    something to diff against.
      # ---------------------------------------------------------------------
      - name: Fetch published manifests for delta packs
        id: deltas
        shell: bash
        env:
          RUNTIME_BASE_URL: ${{ secrets.RUNTIME_BASE_URL }}
        run: |
          set -euo pipefail
          CDN="$RUNNER_TEMP/cdn"
          mkdir -p "$CDN"

          BASE="${RUNTIME_BASE_URL:-https://runtime.theopenpresenter.com}"
          SLUG="${{ matrix.slug }}"
          echo "seeding deltas from $BASE"

          mkdir -p "$RUNNER_TEMP/seed"
          if ! curl -fsSL "$BASE/versions/$SLUG.json" \
                 -o "$RUNNER_TEMP/seed/versions.json" 2>/dev/null; then
            echo "No published versions yet; this will be a full-pack release."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SEED="$RUNNER_TEMP/seed/versions.json"
          mkdir -p "$CDN/versions"
          cp "$SEED" "$CDN/versions/$SLUG.json"

          # Written to a file rather than passed with `-c`: the YAML block
          # indents every line, and Python rejects a leading indent.
          SEED_SCRIPT="$RUNNER_TEMP/seed/latest.py"
          cat > "$SEED_SCRIPT" <<'PY'
          import json, sys
          versions = json.load(open(sys.argv[1])).get("versions", [])
          nightly = "-" in sys.argv[2]
          same = [v for v in versions if ("-" in v) == nightly]
          print(" ".join(same[-3:]))
          PY

          # Build deltas from the most recent few on the same channel. A
          # stable user never has a nightly installed, so a delta from one is
          # no use to them. Older than that, a client is better served by the
          # full pack than by a long delta chain.
          PREVS=$(python3 "$SEED_SCRIPT" "$SEED" "${{ steps.version.outputs.value }}")

          ARGS=""
          for v in $PREVS; do
            [ "$v" = "${{ steps.version.outputs.value }}" ] && continue
            DEST="$CDN/runtimes/$SLUG/$v"
            mkdir -p "$DEST"
            if curl -fsSL "$BASE/runtimes/$SLUG/$v/manifest.json" \
                 -o "$DEST/manifest.json" 2>/dev/null; then
              ARGS="$ARGS $v"
              echo "will build a delta from $v"
            else
              rmdir "$DEST" 2>/dev/null || true
            fi
          done

          echo "args=${ARGS# }" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # 4. Hash and pack the now-signed tree.
      # ---------------------------------------------------------------------
      - name: Publish
        shell: bash
        env:
          RUNTIME_SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${RUNTIME_SIGNING_KEY:-}" ]; then
            echo "RUNTIME_SIGNING_KEY is not set."
            echo "Generate one with: cargo run --bin top-runtime-keygen"
            echo "Publishing unsigned runtimes is not supported: clients"
            echo "refuse manifests that do not verify."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/release.key"
          printf '%s' "$RUNTIME_SIGNING_KEY" > "$KEY_FILE"

          # Derived from what is already published (see the step above), so
          # a plain `git push --tags` still produces deltas. The manual
          # input overrides it when you want a specific set.
          # Written to tolerate bash 3.2, which macOS still ships: there,
          # `${#arr[@]}` and `${arr[@]}` on an empty array are "unbound"
          # under `set -u`, so neither is used without a guard.
          PREVIOUS_ARGS=()
          MANUAL="${{ github.event.inputs.previous }}"
          DERIVED="${{ steps.deltas.outputs.args }}"
          if [ -n "$MANUAL" ]; then
            LIST="${MANUAL//,/ }"
          else
            LIST="$DERIVED"
          fi

          for p in $LIST; do
            PREVIOUS_ARGS+=(--previous "$p")
          done

          if [ -z "${LIST// /}" ]; then
            echo "No previous versions: publishing a full pack only."
          fi

          BIN=native-apps/runtime-manager/target/release/top-runtime-publish
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"

          # The tree was assembled and signed in earlier steps: hashing
          # has to happen after signing, so this publishes an existing
          # directory rather than rebuilding one.
          "$BIN" \
            --runtime "$RUNTIME_DIR" \
            --version "${{ steps.version.outputs.value }}" \
            --schema "${{ github.event.inputs.schema_version || '1' }}" \
            --entry run_server.mjs \
            --channel "${{ steps.version.outputs.channel }}" \
            --platform "${{ matrix.slug }}" \
            --out "$RUNNER_TEMP/cdn" \
            --key "$KEY_FILE" \
            ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"}

          rm -f "$KEY_FILE"

      # A release whose manifest does not verify is worse than no release:
      # every client silently refuses to update. Prove it round-trips here.
      - name: Verify the published release installs
        shell: bash
        env:
          RUNTIME_SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_KEY }}
          TOP_RUNTIME_PUBKEY: ${{ secrets.RUNTIME_PUBLIC_KEY }}
          TOP_ANALYTICS_KEY: ${{ vars.ANALYTICS_KEY }}
        run: |
          set -euo pipefail
          BIN=native-apps/runtime-manager/target/release/top-runtime-manager
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"

          # Verify against the channel this run actually published to, not
          # a default: a nightly that only checked `stable` would pass
          # while pointing at someone else's release.
          CHANNEL="${{ steps.version.outputs.channel }}"
          OUT=$(printf '%s\n' \
            "{\"id\":1,\"cmd\":\"ensure\",\"channel\":\"$CHANNEL\"}" \
            '{"cmd":"shutdown"}' \
            | "$BIN" --root "$RUNNER_TEMP/verify" --source "$RUNNER_TEMP/cdn")

          echo "$OUT" | tail -3
          echo "$OUT" | grep -q '"ok":true' || {
            echo 'The published release does not install. Not uploading it.'
            exit 1
          }

      - name: Stage the manager binary
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          SRC="native-apps/runtime-manager/target/release/top-runtime-manager$EXT"

          mkdir -p "$RUNNER_TEMP/bin"
          cp "$SRC" "$RUNNER_TEMP/bin/top-runtime-manager-${{ matrix.slug }}$EXT"
          ls -la "$RUNNER_TEMP/bin"

      - name: Upload the manager binary
        uses: actions/upload-artifact@v4
        with:
          name: manager-${{ matrix.slug }}-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

      - name: Upload the CDN tree
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.slug }}-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/cdn
          retention-days: 14

  # The matrix produces three CDN trees that have to become one. They share
  # `blobs/` by design (content-addressed, so identical JavaScript across
  # platforms is stored once) and differ everywhere else, which is exactly
  # what the per-platform keys are for: merging is a plain file copy with
  # no conflicts to resolve.

  publish-to-r2:
    name: Publish to R2
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same resolution as the publish job. Duplicated rather than passed
      # between jobs because a matrix job's outputs are whichever runner
      # finished last, which is not something to depend on.
      - name: Work out the version and channel
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL="stable"
          else
            VERSION="0.0.0-nightly.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
            CHANNEL="nightly"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Collect every platform's tree
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*-${{ steps.version.outputs.value }}
          path: trees

      - name: Merge into one CDN tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cdn
          for tree in trees/*/; do
            echo "merging $tree"
            cp -R "$tree". cdn/
          done

          echo "packs:  $(find cdn/packs -type f | wc -l)"
          echo "blobs:  $(find cdn/blobs -type f | wc -l)"
          du -sh cdn

          # A release without a full pack is unusable: a client with no
          # matching delta has nothing to fall back to.
          if ! find cdn/packs -name "full__*" | grep -q .; then
            echo "No full pack in the tree. Refusing to publish."
            exit 1
          fi

      - name: Sync to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!var:-}" ]; then
              echo "$var is not set."
              echo "Add R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT"
              echo "and R2_BUCKET under Settings -> Secrets and variables."
              exit 1
            fi
          done

          s3() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT"; }

          # Immutable content first. Blobs and packs are addressed by hash
          # or by version, so they are never overwritten in place and can
          # be cached forever.
          for dir in blobs packs runtimes; do
            [ -d "cdn/$dir" ] || continue
            echo "syncing $dir"
            s3 sync "cdn/$dir" "s3://$R2_BUCKET/$dir" \
              --cache-control "public, max-age=31536000, immutable" \
              --size-only \
              --no-progress
          done

          # The version index, then the channel pointer. Both are mutable
          # and must not be cached for long, or a client keeps resolving
          # to yesterday's release.
          echo "syncing versions"
          s3 sync cdn/versions "s3://$R2_BUCKET/versions" \
            --cache-control "public, max-age=60" --no-progress

          # Which signed binary each unsigned one became, so the next
          # release reuses it rather than signing it again.
          if [ -d cdn/signed ]; then
            echo "syncing signed binary map"
            s3 sync cdn/signed "s3://$R2_BUCKET/signed" \
              --cache-control "public, max-age=60" --no-progress
          fi

          echo "syncing channel pointer"
          s3 sync cdn/channels "s3://$R2_BUCKET/channels" \
            --cache-control "public, max-age=60" --no-progress

          echo "published ${{ steps.version.outputs.value }} to ${{ steps.version.outputs.channel }}"

  # A compact mirror of each release on GitHub, so there is a human-visible
  # record and a second host if R2 is ever unreachable.
  # Packs and metadata only.
  mirror-to-github:
    name: Mirror packs to GitHub Releases
    needs: publish-to-r2
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and channel
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL="stable"
          else
            VERSION="0.0.0-nightly.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
            CHANNEL="nightly"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Collect every platform's tree
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*-${{ steps.version.outputs.value }}
          path: trees

      - name: Collect the manager binaries
        uses: actions/download-artifact@v4
        with:
          pattern: manager-*-${{ steps.version.outputs.value }}
          path: bins
          merge-multiple: true

      # GitHub Releases has a single flat namespace: no directories, and a
      # name containing "/" is rejected. Keys are flattened with "__", which
      # is what GithubSource in fetch.rs reverses.
      - name: Flatten packs and metadata into assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          for tree in trees/*/; do
            cd "$tree"
            # Blobs are deliberately absent: they are R2's job. Everything
            # else is small and is what a client needs to resolve and
            # install a version.
            find packs channels versions runtimes -type f 2>/dev/null | while read -r f; do
              cp "$f" "$OLDPWD/assets/${f//\//__}"
            done
            cd "$OLDPWD"
          done

          # Binaries already have flat, platform-suffixed names.
          if [ -d bins ]; then
            cp bins/* assets/
            chmod +x assets/top-runtime-manager-* 2>/dev/null || true
          fi

          echo "asset count: $(ls assets | wc -l)"
          du -sh assets

          # A release with no full pack is unusable: a client with no
          # matching delta has nothing to fall back to.
          if ! ls assets | grep -q "__full__"; then
            echo "No full pack among the assets. Refusing to publish."
            exit 1
          fi

          # Likewise a release with no manager: the packs would have
          # nothing able to install them.
          if ! ls assets | grep -q "^top-runtime-manager-"; then
            echo "No manager binary among the assets. Refusing to publish."
            exit 1
          fi

      # Only tagged releases get a permanent versioned tag. A nightly per
      # commit would accumulate hundreds of releases, so nightlies live
      # only at the moving channel pointer below. release.yml publishes
      # these alongside the other components.
      - name: Hand files to the tagged release
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime
          path: assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove assets that are no longer published
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="runtime-${{ steps.version.outputs.channel }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No $TAG release yet; nothing to prune."
            exit 0
          fi

          # Blobs are R2's job and must never appear here: one asset per
          # file is what made the Releases upload fail in the first place.
          mapfile -t STALE < <(
            gh release view "$TAG" --json assets \
              --jq '.assets[].name | select(startswith("blobs__"))'
          )

          echo "${#STALE[@]} stale blob assets on $TAG"
          for name in ${STALE[@]+"${STALE[@]}"}; do
            echo "  removing $name"
            gh release delete-asset "$TAG" "$name" --yes || true
          done

      - name: Move the channel pointer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ steps.version.outputs.channel }}
          name: Runtime (${{ steps.version.outputs.channel }})
          prerelease: ${{ steps.version.outputs.channel != 'stable' }}
          make_latest: false
          files: assets/*
          fail_on_unmatched_files: true
          body: |
            The current ${{ steps.version.outputs.channel }} runtime,
            republished on every build. Currently
            ${{ steps.version.outputs.value }}.

            A compact mirror: packs and metadata, no blobs.
            `--source github:Vija02/TheOpenPresenter@runtime-${{ steps.version.outputs.channel }}`
