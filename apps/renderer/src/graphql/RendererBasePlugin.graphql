query RendererBasePlugin($orgSlug: String!, $projectSlug: String!) {
  pluginMeta {
    ...BaseRendererPluginMeta
  }

  currentUser {
    id
    name
    primaryEmail
    organizationMemberships {
      nodes {
        organizationId
      }
    }
  }

  organizationBySlug(slug: $orgSlug) {
    id
    organizationType
    experimentalFeaturesEnabled
    projects(condition: { slug: $projectSlug }) {
      nodes {
        id
        name
        isPublic
        createdAt
        targetDate
      }
    }
  }

  publicOrGuestProject: projects(condition: { slug: $projectSlug }) {
    nodes {
      id
      name
      isPublic
      organizationId
      createdAt
      targetDate
    }
  }
}

fragment BaseRendererPluginMeta on PluginMeta {
  sceneCreator {
    title
    pluginName
    organizationTypes
  }
  registeredRendererView {
    pluginName
    tag
  }
  registeredLooks {
    pluginName
    looks
  }
  clientPluginViews {
    pluginName
    pluginFamily
    versionId
    isInstallDefault
    rendererTag
    rendererScripts
    rendererCss
    title
    description
  }
}
