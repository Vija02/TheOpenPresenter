query MediaProcessingStatus($mediaIds: [UUID!]!) {
  medias(filter: { id: { in: $mediaIds } }) {
    nodes {
      id
      videoMetadata: mediaVideoMetadatumByVideoMediaId {
        transcodeStatus
        transcodeProgress
        transcodeStage
        transcodeStageProgress
        hlsMediaId
        thumbnailMediaId
        duration
      }
      audioMetadata: mediaAudioMetadatumByAudioMediaId {
        duration
        playbackMediaId
        coverMediaId
        playbackMedia {
          id
          mediaName
        }
        coverMedia {
          id
          mediaName
        }
        title
        artist
        album
        transcodeStatus
        transcodeProgress
      }
    }
  }
}
