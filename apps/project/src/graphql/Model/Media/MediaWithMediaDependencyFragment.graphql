fragment MediaWithMediaDependency on Media {
  id
  ...Media
  imageMetadata: mediaImageMetadatumByImageMediaId {
    width
    height
  }
  videoMetadata: mediaVideoMetadatumByVideoMediaId {
    duration
    hlsMediaId
    thumbnailMediaId
    transcodeStatus
    transcodeProgress
    transcodeStage
    transcodeStageProgress
  }
  audioMetadata: mediaAudioMetadatumByAudioMediaId {
    duration
    playbackMediaId
    coverMediaId
    playbackMedia {
      id
      mediaName
    }
    coverMedia {
      id
      mediaName
    }
    title
    artist
    album
    transcodeStatus
    transcodeProgress
  }
  # Ordered by id so the first image is the first page (ids follow creation)
  dependencies: mediaDependenciesByParentMediaId(orderBy: CHILD_MEDIA_ID_ASC) {
    totalCount
    nodes {
      childMedia {
        id
        mediaName
        fileExtension
        dependencies: mediaDependenciesByParentMediaId(
          orderBy: CHILD_MEDIA_ID_ASC
          first: 1
        ) {
          nodes {
            childMedia {
              id
              mediaName
              fileExtension
            }
          }
        }
      }
    }
  }
}
