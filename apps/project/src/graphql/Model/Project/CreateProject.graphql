mutation CreateProject(
  $organizationId: UUID!
  $slug: String!
  $name: String!
  $categoryId: UUID
  $tags: [UUID]!
  $targetDate: Datetime
  $targetTime: Time
  $templateProjectId: UUID
) {
  createFullProject(
    input: {
      pOrganizationId: $organizationId
      name: $name
      slug: $slug
      categoryId: $categoryId
      tags: $tags
      targetDate: $targetDate
      targetTime: $targetTime
      templateProjectId: $templateProjectId
    }
  ) {
    project {
      id
      slug
      organization {
        id
        slug
      }
    }
  }
}
