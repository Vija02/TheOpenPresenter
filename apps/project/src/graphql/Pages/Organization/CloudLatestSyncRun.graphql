# Polled apart from the page: its `organizationList` asks the cloud.
query OrganizationCloudLatestSyncRun($slug: String!) {
  organizationBySlug(slug: $slug) {
    id
    cloudConnections {
      nodes {
        id
        cloudSyncRuns(orderBy: CREATED_AT_DESC, first: 1) {
          nodes {
            id
            status
            forceResync
            totalProjects
            projectsToSync
            syncedProjects
            addedProjects
            updatedProjects
            failedProjects
            projectsToDelete
            deletedProjects
            mediaStatus
            totalMedia
            syncedMedia
            totalBytes
            downloadedBytes
            error
            startedAt
            completedAt
            createdAt
            trigger
          }
        }
      }
    }
  }
}
