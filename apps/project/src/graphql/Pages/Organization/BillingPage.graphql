query OrganizationBillingPage($slug: String!) {
  ...SharedOrganization

  organizationBySlug(slug: $slug) {
    id
    currentUserIsOwner
    currentUserIsBillingContact
    organizationType
    billingInfo {
      plan
      subscriptionStatus
      currentPeriodEnd
      lifetimeRoomCount
      billingInterval
      cancelAtPeriodEnd
      cancelAt
      isSponsored
    }
    sponsorshipApplication {
      status
      submittedAt
      decidedAt
    }
  }
}
