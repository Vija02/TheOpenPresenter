[package]
name = "top-runtime-manager"
version = "0.1.0"
description = "Downloads, verifies, activates and supervises TheOpenPresenter's Node runtime"
authors = ["vija02"]
edition = "2021"
license = "AGPL-3.0"

[[bin]]
name = "top-runtime-manager"
path = "src/main.rs"

[[bin]]
name = "top-runtime-publish"
path = "src/bin/publish.rs"

[[bin]]
name = "top-runtime-keygen"
path = "src/bin/keygen.rs"

[lib]
name = "top_runtime_manager"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
zstd = "0.13"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
zstd = "0.13"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
# Speed, not size. This binary's hot path is sha256 over ~500MB plus zstd
# decompression, and "z" made a fresh install several seconds slower for a
# saving that is irrelevant next to the runtime it downloads.
opt-level = 3

# The dev profile is what `npm run dev` runs, and an unoptimised build
# turns a 4-second install into 25 seconds, which reads as "the download
# is slow" rather than "this is a debug build". Optimise the dependencies
# that do the heavy lifting while keeping our own code quick to compile.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
