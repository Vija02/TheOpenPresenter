appId: com.theopenpresenter.studio
productName: TheOpenPresenter
executableName: theopenpresenter
directories:
  buildResources: packaging
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/@repo/**"
publish:
  provider: github
  owner: Vija02
  repo: TheOpenPresenter
extraResources:
  - from: packaging/icon.png
    to: icon.png
  - from: resources/
    to: .
    filter:
      - top-runtime-manager*
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
  category: Office
  desktop:
    entry:
      Name: TheOpenPresenter
  artifactName: ${name}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${arch}.${ext}
# The chrome-sandbox SUID fix is needed for every package type that installs
# the unpacked app to /opt (deb, rpm, pacman). AppImage and tar.gz are not
# installed by a package manager, so they have no post-install hook.
deb:
  afterInstall: packaging/postinst.sh
  afterRemove: packaging/postrm.sh
rpm:
  afterInstall: packaging/postinst.sh
  afterRemove: packaging/postrm.sh
pacman:
  afterInstall: packaging/postinst.sh
  afterRemove: packaging/postrm.sh
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
